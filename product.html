        function loadProductDetail() {
            const productId = getProductId();
            const product = productsData[productId];
            
            if (!product) {
                document.querySelector('.product-info h1').textContent = 'Product not found';
                return;
            }
            
            document.getElementById('product-title').textContent = product.name;
            document.getElementById('current-price').textContent = '$' + product.price.toFixed(2);
            document.getElementById('original-price').textContent = '$' + product.originalPrice.toFixed(2);
            
            const discount = Math.round((1 - product.price / product.originalPrice) * 100);
            document.getElementById('discount-badge').textContent = 'Save ' + discount + '%';
            
            document.getElementById('product-description').textContent = product.description;
            
            document.getElementById('main-image').src = product.images[0];
            
            // Image navigation
            let currentImageIndex = 0;
            const totalImages = product.images.length;
            let thumbnailStart = 0;
            const thumbnailsPerPage = 6;
            
            // Change image function
            window.changeImage = function(direction) {
                currentImageIndex += direction;
                if (currentImageIndex < 0) currentImageIndex = totalImages - 1;
                if (currentImageIndex >= totalImages) currentImageIndex = 0;
                
                document.getElementById('main-image').src = product.images[currentImageIndex];
                
                // Update thumbnail selection
                document.querySelectorAll('.product-thumbnail').forEach((t, i) => {
                    t.classList.toggle('active', (thumbnailStart + i) === currentImageIndex);
                });
                
                // Auto-scroll thumbnail if needed
                if (currentImageIndex >= thumbnailStart + thumbnailsPerPage) {
                    thumbnailStart = currentImageIndex - thumbnailsPerPage + 1;
                    renderThumbnails();
                } else if (currentImageIndex < thumbnailStart) {
                    thumbnailStart = currentImageIndex;
                    renderThumbnails();
                }
            };
            
            // Render thumbnails with pagination
            function renderThumbnails() {
                const thumbnailsContainer = document.getElementById('thumbnails');
                thumbnailsContainer.innerHTML = '';
                
                const endIndex = Math.min(thumbnailStart + thumbnailsPerPage, totalImages);
                
                for (let i = thumbnailStart; i < endIndex; i++) {
                    const thumb = document.createElement('img');
                    thumb.src = product.images[i];
                    thumb.className = 'product-thumbnail' + (i === currentImageIndex ? ' active' : '');
                    thumb.onclick = () => {
                        currentImageIndex = i;
                        document.getElementById('main-image').src = product.images[currentImageIndex];
                        document.querySelectorAll('.product-thumbnail').forEach(t => t.classList.remove('active'));
                        thumb.classList.add('active');
                    };
                    thumbnailsContainer.appendChild(thumb);
                }
                
                // Show indicator if more than 6 images
                const indicator = document.getElementById('thumb-indicator');
                const thumbNav = document.getElementById('thumbnail-nav');
                if (totalImages > thumbnailsPerPage) {
                    thumbNav.style.display = 'block';
                    indicator.textContent = `${thumbnailStart + 1}-${endIndex} / ${totalImages}`;
                } else {
                    thumbNav.style.display = 'none';
                }
            }
            
            renderThumbnails();
            
            // Color selector
            const colorSelector = document.getElementById('color-selector');
            const colorOptionsContainer = document.getElementById('color-options');
            const selectedColorName = document.getElementById('selected-color-name');
            const optionSelectorLabel = document.getElementById('option-selector-label');
            const variantOptions = product.colors || [];
            
            colorOptionsContainer.innerHTML = '';
            colorSelector.style.display = 'none';
            if (optionSelectorLabel) {
                optionSelectorLabel.textContent = product.optionLabel || 'Color';
            }
            
            if (variantOptions.length > 0) {
                colorSelector.style.display = 'block';
                let selectedColor = variantOptions[0];
                
                const updateDisplayedPrice = (selectedOption) => {
                    const activePrice = typeof selectedOption.price === 'number' ? selectedOption.price : product.price;
                    document.getElementById('current-price').textContent = '$' + activePrice.toFixed(2);
                    const discount = Math.round((1 - activePrice / product.originalPrice) * 100);
                    document.getElementById('discount-badge').textContent = 'Save ' + discount + '%';
                };
                
                variantOptions.forEach((color, index) => {
                    const colorBtn = document.createElement('img');
                    colorBtn.className = 'color-option' + (index === 0 ? ' active' : '');
                    colorBtn.src = color.image;
                    colorBtn.alt = color.name;
                    colorBtn.title = color.name;
                    colorBtn.onclick = () => {
                        // Update selection
                        document.querySelectorAll('.color-option').forEach(c => c.classList.remove('active'));
                        colorBtn.classList.add('active');
                        selectedColor = color;
                        selectedColorName.textContent = color.name;
                        
                        // Change main image
                        currentImageIndex = color.imageIndex || 0;
                        document.getElementById('main-image').src = product.images[currentImageIndex];
                        
                        // Update thumbnail selection
                        document.querySelectorAll('.product-thumbnail').forEach((t, i) => {
                            t.classList.toggle('active', i === currentImageIndex);
                        });
                        
                        updateDisplayedPrice(selectedColor);
                    };
                    colorOptionsContainer.appendChild(colorBtn);
                });
                
                selectedColorName.textContent = selectedColor.name;
                updateDisplayedPrice(selectedColor);
            }
            
            const featuresList = document.getElementById('features-list');
            product.features.forEach(feature => {
                const li = document.createElement('li');
                li.textContent = feature;
                featuresList.appendChild(li);
            });
            
            loadReviews(product.reviews);
            
            document.title = product.name + ' | Cat Litter Box | PetJoy Store';
            const metaDescription = document.querySelector('meta[name="description"]');
            if (metaDescription) {
                metaDescription.setAttribute('content', product.description);
            }
        }

        function loadReviews(reviews) {
            const avgRating = reviews.reduce((sum, r) => sum + r.rating, 0) / reviews.length;
            
            document.getElementById('avg-rating').textContent = avgRating.toFixed(1);
            document.getElementById('stars-display').textContent = '*'.repeat(Math.round(avgRating)) + 'o'.repeat(5 - Math.round(avgRating));
            document.getElementById('total-reviews').textContent = reviews.length + ' reviews';
            
            const ratingCounts = {};
            reviews.forEach(r => {
                ratingCounts[r.rating] = (ratingCounts[r.rating] || 0) + 1;
            });
            
            const barsContainer = document.getElementById('rating-bars');
            for (let i = 5; i >= 1; i--) {
                const count = ratingCounts[i] || 0;
                const percent = (count / reviews.length * 100).toFixed(0);
                barsContainer.innerHTML += `
                    <div class="rating-bar">
                        <span class="rating-bar-label">${i} stars</span>
                        <div class="rating-bar-track">
                            <div class="rating-bar-fill" style="width: ${percent}%"></div>
                        </div>
                        <span class="rating-bar-count">${count}</span>
                    </div>
                `;
            }
            
            const reviewsContainer = document.getElementById('reviews-list');
            reviews.forEach(review => {
                const initials = review.name.split(' ').map(n => n[0]).join('');
                const stars = '*'.repeat(review.rating) + 'o'.repeat(5 - review.rating);
                
                reviewsContainer.innerHTML += `
                    <div class="review-card">
                        <div class="review-header">
                            <div class="reviewer-info">
                                <div class="reviewer-avatar">${initials}</div>
                                <div>
                                    <div class="reviewer-name">${review.name}${review.verified ? '<span class="verified-badge">Verified</span>' : ''}</div>
                                    <div class="review-date">${review.date}</div>
                                </div>
                            </div>
                            <div class="review-rating">${stars}</div>
                        </div>
                        <div class="review-title">${review.title}</div>
                        <p class="review-text">${review.text}</p>
                        <button class="helpful-btn">Helpful (${review.helpful || 0})</button>
                    </div>
                `;
            });
        }

        function changeQuantity(delta) {
            const input = document.getElementById('quantity');
            let value = parseInt(input.value) + delta;
            if (value < 1) value = 1;
            if (value > 10) value = 10;
            input.value = value;
        }

        function addToCartFromDetail() {
            const productId = getProductId();
            const quantity = parseInt(document.getElementById('quantity').value);
            const product = productsData[productId];
            
            // Use color-specific image if selected, otherwise use first image
            let image = product.images[0];
            let selectedPrice = product.price;
            if (product.colors && product.colors.length > 0) {
                const activeColor = document.querySelector('.color-option.active');
                if (activeColor) {
                    image = activeColor.src;
                }
                const selectedVariantName = document.getElementById('selected-color-name').textContent;
                const selectedVariant = product.colors.find(option => option.name === selectedVariantName);
                if (selectedVariant && typeof selectedVariant.price === 'number') {
                    selectedPrice = selectedVariant.price;
                }
            }
            
            // Get selected color name
            let colorName = '';
            const selectedColorNameEl = document.getElementById('selected-color-name');
            if (selectedColorNameEl && selectedColorNameEl.textContent) {
                colorName = selectedColorNameEl.textContent;
            }
            
            // Add to cart with image and color info
            const uniqueId = colorName ? product.id + '_' + colorName.replace(/\s+/g, '_') : product.id;
            
            addToCart(uniqueId, product.name, selectedPrice, image, colorName, quantity);
            
            updateCartCount();
        }

        window.addEventListener('DOMContentLoaded', function() {
            loadProductDetail();
            updateCartCount();
        });
    </script>
</body>
</html>
